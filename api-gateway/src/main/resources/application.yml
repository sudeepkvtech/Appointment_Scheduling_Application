spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Enable service discovery routing
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # Route definitions
      routes:
        # Scheduling Service Routes
        - id: scheduling-service
          uri: lb://scheduling-service
          predicates:
            - Path=/api/v1/scheduling/**
          filters:
            - StripPrefix=0

        # Encounter Service Routes
        - id: encounter-service
          uri: lb://encounter-service
          predicates:
            - Path=/api/v1/encounters/**
          filters:
            - StripPrefix=0

        # Master Data Service Routes - Appointment Types
        - id: master-data-appointment-types
          uri: lb://master-data-service
          predicates:
            - Path=/api/v1/appointment-types/**
          filters:
            - StripPrefix=0

        # Master Data Service Routes - Resources
        - id: master-data-resources
          uri: lb://master-data-service
          predicates:
            - Path=/api/v1/resources/**
          filters:
            - StripPrefix=0

        # Master Data Service Routes - Locations
        - id: master-data-locations
          uri: lb://master-data-service
          predicates:
            - Path=/api/v1/locations/**
          filters:
            - StripPrefix=0

      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://localhost:4200"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: true
            max-age: 3600

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# JWT Configuration (for future authentication)
jwt:
  secret: your-256-bit-secret-key-change-this-in-production-must-be-at-least-256-bits
  expiration: 86400000 # 24 hours in milliseconds

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

---
# Docker profile
spring:
  config:
    activate:
      on-profile: docker

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
